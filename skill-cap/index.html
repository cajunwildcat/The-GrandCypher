<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Cap Verifier</title>
    <script src="util.js"></script>
    <script src="caps.js"></script>
    <script src="mods.js"></script>
    <script src="calculator.js"></script>
    <script src="ui.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <!-- External libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chosen/1.8.7/chosen.jquery.min.js" integrity="sha512-rMGGF4wg1R73ehtnxXBt5mbUfN9JUJwbk21KMlnLZDJh7BkPmeovBuddZCENJddHYYMkCh9hPFnPmS9sspki8g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chosen/1.8.7/chosen.min.css" integrity="sha512-yVvxUQV0QESBt1SyZbNJMAwyKvFTLMyXSyBHDO4BG5t7k/Lw34tyqlSDlKIrIENIzCl+RVUNjmCPG+V/GMesRw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div id="mods-area">
        <table id="mods-input-table">
            <tr><th colspan=20><select id="add-mod-row-select" class="chosen-select" data-placeholder="Add a mod +"></select></th></tr>
            <tr class="header-row">
                <th>Mod</th>
                <th>Grid</th>
                <th>Passive</th>
                <th>Buff</th>
            </tr>
        </table>
    </div>
    <div style="display:flex; flex-direction:column;">
        <div id="mods-area-top">
            <div>
                <span><img src="./assets/zhurong yupei.jpg" /><input id="yupei-check" type="checkbox" checked /></span>
                <span><img src="./assets/signum heredis.jpg" /><input id="ele-atk-wonder-check" type="checkbox" checked /></span>
                <span><img src="./assets/oppressus fragor.jpg" /><input id="dmg-cap-wonder-check" type="checkbox" checked /></span>
                <span><img src="./assets/symbolum amicitiae.jpg" /><input id="amp-wonder-input" /><p>%</p></span>
                <span><img src="./assets/Crew Ship.png" /><input id="crew-ship-input" value="10" /><p>%</p></span>
                <span><img src="./assets/Rainbow Reactor.png" /><input id="crew-reactor-input" value="10" /><p>%</p></span>
            </div>
            <div>
                <span>Base ATK <input id="base-atk-input" /></span>
                <span>DMG Mod <input id="dmg-mod-input" value="100" />%</span>
                <span>Ally Elem <select id="ally-elem-select">
                        <option>Fire</option>
                        <option>Water</option>
                        <option>Earth</option>
                        <option>Wind</option>
                        <option>Light</option>
                        <option>Dark</option>
                    </select></span>
                <span>DMG Elem <select id="ally-dmg-elem-select">
                        <option selected>Ally Elem</option>
                        <option>Fire</option>
                        <option>Water</option>
                        <option>Earth</option>
                        <option>Wind</option>
                        <option>Light</option>
                        <option>Dark</option>
                        <option>Destruction</option>
                        <option>Plain</option>
                    </select></span>
                <span>DMG Type <select id="dmg-type-select">
                        <option value=0>Normal Attack</option>
                        <option value=1 selected>Skill</option>
                        <option value=2>Charge Attack</option>
                        <option value=3 disabled>Counter</option>
                    </select></span>
                <span><img src="./assets/Piercing Sight.png" /><input id="piercing-sight-check" type="checkbox" /></span>
                <span><img src="./assets/Perpetuity Ring.png" /><input id="perp-ring-check" type="checkbox" /></span>
                <span>Echo Mod <input id="echo-mod-input" value="0" /><p>%</p></span>
            </div>
            <div>
                <span>Enemy Elem <select id="enemy-elem-select">
                        <option>Inferior</option>
                        <option>Fire</option>
                        <option>Water</option>
                        <option>Earth</option>
                        <option>Wind</option>
                        <option>Light</option>
                        <option>Dark</option>
                        <option>Null</option>
                    </select></span>
                <span><p>DEF</p> <input id="enemy-def-input" value="10" /></span>
                <span><img src="./assets/DEF Up.png" /><input id="enemy-def-up-input" value="0" /><p>%</p></span>
                <span><img src="./assets/DEF Down.png" /><input id="enemy-def-down-input" value="0" /><p>%</p></span>
                <span><img src="./assets/Unique DEF Down.png" /><input id="def-down-sp-check" type="checkbox" /></span>
            </div>
            <div>
                <span>Hard Cap <select id="hard-cap-select">
                        <option value="Hard6">6,600,000</option>
                        <option value="Hard13" selected>13,100,000</option>
                    </select></span>
                <span>Elem Res <input id="elem-res-input" value="0" /><p>%</p></span>
            </div>
            <div>
                <span>Mode <select id="mode-select">
                        <option value="verify">Verify</option>
                        <option value="find">Find</option>
                    </select></span>

                <span>DMG Cap <select id="dmg-cap-select" class="chosen-select"></select></span>

                <span>Sub Table
                    <select id="sub-table-select">
                        <option selected>None</option>
                        <option>Echo</option>
                        <option>RNG Crit</option>
                        <option>DEF Down</option>
                        <option>Custom</option>
                    </select>
                </span>

                <span>Echo Mod <input id="sub-table-echo-input" class="sub-table-input" value="0" /><p>%</p></span>
                <span>RNG Crit Mod <input id="sub-table-crit-input" class="sub-table-input" value="0" /><p>%</p></span>
                <span>DEF Down <input id="sub-table-def-input" class="sub-table-input" value="0" /><p>%</p></span>
            </div>

        </div>

        <div>
            <div id="validate-area">
                <textarea id="observed-input"></textarea>
                <div id="rng-result-table"></div>
            </div>
        </div>
    </div>
</body>

</html>
