<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Cap Verifier</title>
    <script src="default-saved-teams.js"></script>
    <script src="util.js"></script>
    <script src="caps.js"></script>
    <script src="mods.js"></script>
    <script src="calculator.js"></script>
    <script src="ui.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <!-- External libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chosen/1.8.7/chosen.jquery.min.js" integrity="sha512-rMGGF4wg1R73ehtnxXBt5mbUfN9JUJwbk21KMlnLZDJh7BkPmeovBuddZCENJddHYYMkCh9hPFnPmS9sspki8g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="chosen-alias-search.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chosen/1.8.7/chosen.min.css" integrity="sha512-yVvxUQV0QESBt1SyZbNJMAwyKvFTLMyXSyBHDO4BG5t7k/Lw34tyqlSDlKIrIENIzCl+RVUNjmCPG+V/GMesRw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div id="mods-area">
        <div>
            <button disabled id="delete-saved-team-button">Delete</button>
            <select id="saved-team-select" class="chosen-select" data-placeholder="Load a saved team">
                <option></option>
                <option>Empty</option>
            </select>
            <button disabled id="save-saved-team-button">Save</button>
            <button id="save-new-saved-team-button">Save As New</button>
        </div>
        <div>
            <select id="add-mod-row-select" class="chosen-select" data-placeholder="Add a mod +"></select>
        </div>
        <div id="mods-table-overflow-wrapper">
            <table id="mods-input-table">
                <tr class="header-row">
                    <th>Mod</th>
                    <th>Grid</th>
                    <th>Passive<br><button id="char-emp-import-button">Import EMPs</button></th>
                    <th>Buff</th>
                </tr>
            </table>
        </div>
    </div>
    <div style="display:flex; flex-direction:column;">
        <div id="mods-area-top">
            <div>
                <div id="elem-wonders">
                    <span><img src="./assets/fire yupei.jpg" class="wonder-image" /><input id="fire-yupei-check" class="wonder-input" type="checkbox" checked /></span>
                    <span><img src="./assets/water yupei.jpg" class="wonder-image" /><input id="water-yupei-check" class="wonder-input" type="checkbox" checked /></span>
                    <span><img src="./assets/earth yupei.jpg" class="wonder-image" /><input id="earth-yupei-check" class="wonder-input" type="checkbox" checked /></span>
                    <span><img src="./assets/wind yupei.jpg" class="wonder-image" /><input id="wind-yupei-check" class="wonder-input" type="checkbox" checked /></span>
                    <span><img src="./assets/light yupei.jpg" class="wonder-image" /><input id="light-yupei-check" class="wonder-input" type="checkbox" checked /></span>
                    <span><img src="./assets/dark yupei.jpg" class="wonder-image" /><input id="dark-yupei-check" class="wonder-input" type="checkbox" checked /></span>

                    <span><img src="./assets/fire arcarum ring.jpg" class="wonder-image" /><input disabled id="fire-arcarum-ring-check" class="wonder-input" type="checkbox" /></span>
                    <span><img src="./assets/water arcarum ring.jpg" class="wonder-image" /><input disabled id="water-arcarum-ring-check" class="wonder-input" type="checkbox" /></span>
                    <span><img src="./assets/earth arcarum ring.jpg" class="wonder-image" /><input id="earth-arcarum-ring-check" class="wonder-input" type="checkbox" /></span>
                    <span><img src="./assets/wind arcarum ring.jpg" class="wonder-image" /><input disabled id="wind-arcarum-ring-check" class="wonder-input" type="checkbox" /></span>
                    <span><img src="./assets/light arcarum ring.jpg" class="wonder-image" /><input disabled id="light-arcarum-ring-check" class="wonder-input" type="checkbox" /></span>
                    <span><img src="./assets/dark arcarum ring.jpg" class="wonder-image" /><input id="dark-arcarum-ring-check" class="wonder-input" type="checkbox" /></span>
                </div>
                <span><img src="./assets/signum heredis.jpg" class="wonder-image" /><input id="ele-atk-wonder-check" class="wonder-input" type="checkbox" checked /></span>
                <span><img src="./assets/oppressus fragor.jpg" class="wonder-image" /><input id="dmg-cap-wonder-check" class="wonder-input" type="checkbox" checked /></span>
                <span><img src="./assets/symbolum amicitiae.jpg" class="wonder-image" /><input id="amp-wonder-input" class="wonder-input" />
                    <p>%</p>
                </span>
                <span><img src="./assets/Crew Ship.png" class="wonder-image" /><input id="crew-ship-input" value="10" class="wonder-input" />
                    <p>%</p>
                </span>
                <span><img src="./assets/Rainbow Reactor.png" class="wonder-image" /><input id="crew-reactor-input" value="10" class="wonder-input" />
                    <p>%</p>
                </span>
            </div>
            <div>
                <span>Hard Cap <select id="hard-cap-select">
                        <option value="Hard6">6,600,000</option>
                        <option value="Hard13" selected>13,100,000</option>
                    </select></span>
                <span>Elem Res <input id="elem-res-input" value="0" />
                    <p>%</p>
                </span>
            </div>
            <div>
                <span>Enemy Elem <select id="enemy-elem-select">
                        <option>Inferior</option>
                        <option>Fire</option>
                        <option>Water</option>
                        <option>Earth</option>
                        <option>Wind</option>
                        <option>Light</option>
                        <option>Dark</option>
                        <option>Null</option>
                    </select></span>
                <span>
                    <p>DEF</p> <input id="enemy-def-input" value="10" />
                </span>
                <span><img src="./assets/DEF Up.png" /><input id="enemy-def-up-input" value="0" />
                    <p>%</p>
                </span>
                <span><img src="./assets/DEF Down.png" /><input id="enemy-def-down-input" value="0" />
                    <p>%</p>
                </span>
                <span><img src="./assets/Unique DEF Down.png" /><input id="def-down-sp-check" type="checkbox" /></span>
            </div>
            <div>
                <span>DMG Elem <select id="ally-dmg-elem-select">
                        <option selected>Ally Elem</option>
                        <option>Fire</option>
                        <option>Water</option>
                        <option>Earth</option>
                        <option>Wind</option>
                        <option>Light</option>
                        <option>Dark</option>
                        <option>Destruction</option>
                        <option>Plain</option>
                    </select></span>
                <span><img src="./assets/Piercing Sight.png" /><input id="piercing-sight-check" type="checkbox" /></span>
                <span>DMG Type <select id="dmg-type-select">
                        <option value=0>Normal Attack</option>
                        <option value=1 selected>Skill</option>
                        <option value=2>Charge Attack</option>
                        <option value=3 disabled>Counter</option>
                    </select></span>
                <span hidden>Echo Mod <input id="echo-mod-input" value="0" />
                    <p>%</p>
                </span>
            </div>
            <hr style="width: 100%;">
            <div>
                <span>Ally Elem <select id="ally-elem-select">
                        <option>Fire</option>
                        <option>Water</option>
                        <option>Earth</option>
                        <option>Wind</option>
                        <option>Light</option>
                        <option>Dark</option>
                    </select></span>
                <span>Base ATK <input id="base-atk-input" /></span>
                <span>DMG Mod <input id="dmg-mod-input" />%</span>
                <span><img src="./assets/Perpetuity Ring.png" /><input id="perp-ring-check" type="checkbox" /></span>
                <span><img src="./assets/eternal wonder.jpg" /><img src="./assets/zodiac wonder.jpg" /><input id="perp-wonder-check" type="checkbox" /></span>
            </div>
            <div>
                <span>Mode <select id="mode-select">
                        <option value="verify">Verify</option>
                        <option value="find">Find</option>
                        <option value="new">New Cap</option>
                    </select></span>

                <span>DMG Cap <select id="dmg-cap-select" class="chosen-select"></select></span>

                <span>Sub Table
                    <select id="sub-table-select">
                        <option selected>None</option>
                        <option id="sub-table-echo-opt" hidden>Echo</option>
                        <option>RNG Crit</option>
                        <option>DEF Down</option>
                        <option>% Cap</option>
                        <option>Custom</option>
                    </select>
                </span>

                <span>Echo Mod <input id="sub-table-echo-input" class="sub-table-input" value="0" />
                    <p>%</p>
                </span>
                <span>RNG Crit Mod <input id="sub-table-crit-input" class="sub-table-input" value="0" />
                    <p>%</p>
                </span>
                <span>DEF Down <input id="sub-table-def-input" class="sub-table-input" value="0" />
                    <p>%</p>
                </span>
            </div>

        </div>

        <div>
            <div id="validate-area">
                <textarea id="observed-input"></textarea>
                <div>
                    <div id="cap-info-row">
                        <span class="cap-info-desc">Thresholds:</span>
                        <input class="custom-cap-info threshold" /><input class="custom-cap-info threshold" /><input class="custom-cap-info threshold" /><input class="custom-cap-info threshold" />
                        <span class="cap-info"></span><span class="cap-info"></span><span class="cap-info"></span><span class="cap-info"></span>
                        <span class="cap-info-desc">Attenuations:</span>
                        <input class="custom-cap-info attenuation" /><p class="custom-cap-info">%</p>
                        <input class="custom-cap-info attenuation" /><p class="custom-cap-info">%</p>
                        <input class="custom-cap-info attenuation" /><p class="custom-cap-info">%</p>
                        <input class="custom-cap-info attenuation" /><p class="custom-cap-info">%</p>
                        <span class="cap-info"></span><span class="cap-info"></span><span class="cap-info"></span><span class="cap-info"></span>
                    </div>
                    <div id="rng-result-table"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
